<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f8e8f0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>CarbTracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <a id="sheetLink" class="iconBtn" href="" target="_blank" rel="noopener" aria-label="Open the spreadsheet" aria-disabled="true"></a>
      <div class="dateWrap">
        <span id="headerDate" class="date"></span>
        <span id="devBadge" class="devBadge" hidden>DEV</span>
      </div>
      <button id="settingsBtn" class="iconBtn" type="button" aria-label="Settings"></button>
    </header>

    <div id="bar" class="bar">
      <div class="barMeal">
        <span id="barMealName" class="barMealName"></span>
        <span id="barStatus" class="barStatus"></span>
      </div>
      <div class="barTotal">
        <span id="barTotal" class="barTotalNum">0</span>
        <span class="barUnit">g carbs</span>
      </div>
      <div id="barActions" class="barActions">
        <button id="cancelBtn" class="iconBtn" type="button" aria-label="Cancel" title="Cancel" hidden></button>
        <button id="saveBtn" class="btn btnPrimary" type="button" hidden>Save</button>
      </div>
    </div>

    <div id="banners" class="banners"></div>

    <main id="main" class="main"></main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <dialog id="settingsDialog" class="dialog">
    <form method="dialog" class="dialogForm">
      <div class="dialogHead">
        <h2>Settings</h2>
        <button id="settingsCloseBtn" class="iconBtn" type="submit" aria-label="Close"></button>
      </div>

      <section class="settingsGroup">
        <h3>Font size</h3>
        <div id="fontChoices" class="choices"></div>
      </section>

      <section class="settingsGroup">
        <h3>Background colour</h3>
        <div id="colorChoices" class="swatches"></div>
      </section>

      <section class="settingsGroup">
        <h3>Theme</h3>
        <div id="themeChoices" class="choices"></div>
      </section>

      <section class="settingsGroup">
        <div class="settingsGroupHead">
          <h3>Spreadsheet connection</h3>
          <button id="connectionToggleBtn" class="btn" type="button" aria-expanded="false" aria-controls="connectionFields">Show</button>
        </div>
        <div id="connectionFields" hidden>
        <label class="field">
          <span>Web app URL</span>
          <input id="webAppUrlInput" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec">
        </label>
        <label class="field">
          <span>Secret</span>
          <input id="secretInput" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
        </label>
        <label class="checkField">
          <input id="devModeInput" type="checkbox">
          <span>Dev mode (reads and writes the <b>Testing</b> sheet)</span>
        </label>
        <div class="settingsActions">
          <button id="settingsSaveBtn" class="btn btnPrimary" type="button">Save and test</button>
          <span id="settingsTestResult" class="testResult"></span>
        </div>
        </div>
      </section>
    </form>
  </dialog>

  <template id="rowTpl">
    <div class="row">
      <div class="rowName">
        <input class="nameInput" type="text" placeholder="Food" autocomplete="off" autocapitalize="sentences" enterkeyhint="next" aria-label="Food">
        <button class="delBtn iconBtn" type="button" aria-label="Remove row" tabindex="-1"></button>
        <ul class="favs" hidden></ul>
      </div>
      <div class="rowNums">
        <label class="num"><span>carbs/100g</span><input class="per100Input" type="text" inputmode="decimal" enterkeyhint="next" aria-label="Carbs per 100g"></label>
        <label class="num"><span>weight g</span><input class="weightInput" type="text" inputmode="decimal" enterkeyhint="next" aria-label="Weight in grams"></label>
        <label class="num carbsCell"><span>carbs</span><input class="carbsInput" type="text" inputmode="decimal" enterkeyhint="next" aria-label="Carbs"></label>
      </div>
    </div>
  </template>

  <script type="module" src="js/app.js"></script>
</body>
</html>
